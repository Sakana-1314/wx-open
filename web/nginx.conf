# web 镜像内的 nginx 配置：托管 SPA 静态产物，并把 /api 与 /callback 反代到后端容器。
#
# 该文件被复制到 /etc/nginx/templates/default.conf.template，
# nginx 镜像入口脚本会用环境变量做 envsubst（BACKEND_HOST / BACKEND_PORT 见 Dockerfile）。
#
# 关键点（与微信接入要求直接相关）：
#   1. 回调 /callback/* 必须原样转发且不缓冲：微信要求快速返回纯文本 success。
#   2. /callback/* 不做鉴权、不加限流；其安全性来自 msg_signature 校验与 receiveid 校验。
#   3. SPA 需要 history 回退到 index.html（/authorize/callback 等前端路由不能 404）。
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    # 上传代码走 JSON body，留足余量（微信侧 user_version 与 ext_json 都很小）。
    client_max_body_size 20m;

    # 微信回调：不缓冲、原样转发（先回 success 再异步处理是后端自身的约定）。
    location /callback/ {
        proxy_pass         http://${BACKEND_HOST}:${BACKEND_PORT};
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_buffering    off;
        proxy_read_timeout 30s;
    }

    # 平台 API：批量作业的同步接口可能较慢（提审/发布），超时放宽到 120s。
    location /api/ {
        proxy_pass         http://${BACKEND_HOST}:${BACKEND_PORT};
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location = /healthz {
        proxy_pass http://${BACKEND_HOST}:${BACKEND_PORT};
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
