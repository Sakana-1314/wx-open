name: 后端：格式·静态检查·契约·测试

on:
  push:
    branches: [master, main]
    paths: ["server/**", "api/**", ".github/workflows/ci-backend.yml"]
  pull_request:
    paths: ["server/**", "api/**", ".github/workflows/ci-backend.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端检查（gofmt / vet / build / 契约 / go test）
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wx_platform_test
          MYSQL_USER: wxplatform
          MYSQL_PASSWORD: wxplatform_dev_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod

      - name: gofmt 格式检查
        working-directory: server
        run: |
          UNFORMATTED="$(gofmt -l ./internal ./cmd)"
          if [[ -n "$UNFORMATTED" ]]; then
            echo "以下文件未格式化："
            echo "$UNFORMATTED"
            exit 1
          fi
          echo "✅ gofmt 通过"

      - name: go vet
        working-directory: server
        run: go vet ./...

      - name: go build
        working-directory: server
        run: go build ./...

      - name: 契约一致性（api.gen.go 与 api/openapi.yaml 对齐）
        working-directory: server
        run: |
          go run github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@v2.8.0 \
            -generate types,gin -package gen -o /tmp/api.gen.check.go ../api/openapi.yaml
          if ! diff -q /tmp/api.gen.check.go internal/gen/api.gen.go > /dev/null; then
            echo "❌ internal/gen/api.gen.go 与 api/openapi.yaml 不一致"
            echo "请在仓库根目录执行 make gen 并提交生成文件"
            exit 1
          fi
          echo "✅ 契约一致"

      - name: 单元测试 + 集成测试（真实 MySQL）
        working-directory: server
        env:
          TEST_DB_DSN: "root:root@tcp(127.0.0.1:3306)/wx_platform_test?charset=utf8mb4&parseTime=True&loc=Local"
        run: go test -p 1 ./...

      - name: 端到端测试（内置模拟微信服务端，无需真实凭据）
        working-directory: server
        env:
          TEST_DB_DSN: "root:root@tcp(127.0.0.1:3306)/wx_platform_e2e?charset=utf8mb4&parseTime=True&loc=Local"
        run: go test ./internal/e2e/ -count=1 -v
