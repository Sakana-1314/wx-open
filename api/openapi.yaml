openapi: 3.0.3
info:
  title: 微信第三方平台管理平台 API
  description: |
    管理微信开放平台第三方平台（服务商）名下的数十个小程序：授权管理、代码模板库、
    批量上传代码（commit）、批量提审、批量发布，以及作业编排、审核/发布台账与全量调用日志。

    本文件是前后端对齐的唯一依据。Go 端由 oapi-codegen 生成 server/internal/gen/api.gen.go，
    TS 端由 openapi-typescript 生成 web/src/api/schema.d.ts，禁止手改生成文件。

    鉴权：除 POST /auth/login 外，全部接口需携带 `Authorization: Bearer <JWT>`。

    微信回调（/callback/component、/callback/message/{appid}）不在本契约内：它们收发 XML、
    成功时需返回纯文本 success，与 JSON 契约不兼容，故在 router 中单独注册。
  version: 1.0.0
servers:
  - url: http://localhost:8091/api/v1
tags:
  - name: auth
    description: 平台登录与身份
  - name: platform
    description: 第三方平台状态与运行参数
  - name: authorizers
    description: 已授权小程序（授权链路、信息同步、ext 变量与选项）
  - name: templates
    description: 代码草稿箱与模板库
  - name: preflight
    description: 批量操作前置体检
  - name: jobs
    description: 批量作业与逐项执行明细
  - name: audits
    description: 代码审核状态、撤回、加急与额度
  - name: releases
    description: 发布、灰度、回退与版本信息
  - name: apps
    description: 单个小程序的域名、页面、服务状态与基础库
  - name: logs
    description: 微信调用日志、回调事件与平台操作日志

paths:
  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: 管理员登录（签发 JWT）
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/me:
    get:
      tags: [auth]
      operationId: getCurrentUser
      summary: 当前登录用户
      responses:
        '200':
          description: 当前用户
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserInfo' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /platform/status:
    get:
      tags: [platform]
      operationId: getPlatformStatus
      summary: 平台状态总览（票据新鲜度、令牌有效期、额度、授权与作业统计）
      responses:
        '200':
          description: 状态
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlatformStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /platform/push-ticket:
    post:
      tags: [platform]
      operationId: ensurePushTicket
      summary: 调用 api_start_push_ticket 恢复票据推送（长时间收不到 component_verify_ticket 时的官方处置手段）
      description: |
        微信会向「授权事件接收 URL」每 10 分钟推送一次 component_verify_ticket（有效期 12 小时）。
        若推送中断（票据超 20 分钟未更新、或 61005/61006 报错），可调用本接口让微信恢复推送；
        恢复后仍需等待下一次推送到达，本接口不返回票据本身。
      responses:
        '204':
          description: 已请求恢复推送（请稍后在概览页确认票据新鲜度）
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '502': { $ref: '#/components/responses/WeChatError' }

  /platform/settings:
    get:
      tags: [platform]
      operationId: getSettings
      summary: 运行参数（非密钥）
      responses:
        '200':
          description: 参数
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Settings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [platform]
      operationId: updateSettings
      summary: 更新运行参数
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SettingsUpdateRequest' }
      responses:
        '200':
          description: 更新后的参数
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Settings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /authorizers:
    get:
      tags: [authorizers]
      operationId: listAuthorizers
      summary: 小程序列表（分页 + 筛选）
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: keyword
          in: query
          description: 模糊匹配昵称 / appid / 备注 / 主体名称
          schema: { type: string }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/AuthorizationStatus' }
        - name: groupName
          in: query
          schema: { type: string }
        - name: tag
          in: query
          schema: { type: string }
        - name: hasDevPermission
          in: query
          description: 是否已授权开发权限集（权限集 18）
          schema: { type: boolean }
      responses:
        '200':
          description: 分页列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthorizerListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /authorizers/sync:
    post:
      tags: [authorizers]
      operationId: syncAuthorizers
      summary: 从微信侧同步授权方清单与信息（全量或指定）
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AppidSelection' }
      responses:
        '200':
          description: 同步结果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SyncSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '502': { $ref: '#/components/responses/WeChatError' }

  /authorizers/resync-tokens:
    post:
      tags: [authorizers]
      operationId: resyncAuthorizerTokens
      summary: 从 api_get_authorizer_list 重新拉取全部 authorizer_refresh_token（refresh_token 丢失/失效时的官方恢复路径）
      responses:
        '200':
          description: 恢复结果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SyncSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '502': { $ref: '#/components/responses/WeChatError' }

  /authorizers/authorization-url:
    get:
      tags: [authorizers]
      operationId: getAuthorizationUrl
      summary: 生成预授权码与授权链接（PC / 移动端 / 二维码内容）
      parameters:
        - name: authType
          in: query
          description: 授权类型，默认 2（仅小程序）
          schema: { $ref: '#/components/schemas/AuthType' }
        - name: bizAppid
          in: query
          description: 指定唯一授权小程序 appid（优先级高于 authType）
          schema: { type: string }
        - name: redirectUri
          in: query
          description: 授权回调地址，需与后台「授权发起页域名」一致
          schema: { type: string }
        - name: categoryIdList
          in: query
          description: 指定权限集 id 列表（逗号分隔），不传则用已发布权限集
          schema: { type: string }
      responses:
        '200':
          description: 授权链接
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthorizationUrlResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '502': { $ref: '#/components/responses/WeChatError' }

  /authorizers/authorize:
    post:
      tags: [authorizers]
      operationId: completeAuthorize
      summary: 用授权回调携带的 auth_code 换取令牌并登记小程序（供授权回调页调用）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuthorizeRequest' }
      responses:
        '200':
          description: 授权结果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthorizeResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '502': { $ref: '#/components/responses/WeChatError' }

  /authorizers/{appid}:
    parameters:
      - $ref: '#/components/parameters/Appid'
    get:
      tags: [authorizers]
      operationId: getAuthorizer
      summary: 小程序详情（含权限集、类目与域名快照）
      responses:
        '200':
          description: 详情
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthorizerDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [authorizers]
      operationId: updateAuthorizer
      summary: 编辑备注 / 分组 / 标签 / 启停 / ext 变量 / 提审配置
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuthorizerUpdateRequest' }
      responses:
        '200':
          description: 更新后的详情
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthorizerDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [authorizers]
      operationId: deleteAuthorizer
      summary: 删除未授权的小程序记录
      responses:
        '204': { description: 已删除 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /authorizers/{appid}/sync:
    parameters:
      - $ref: '#/components/parameters/Appid'
    post:
      tags: [authorizers]
      operationId: syncAuthorizer
      summary: 同步单个小程序信息
      responses:
        '200':
          description: 详情
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthorizerDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '502': { $ref: '#/components/responses/WeChatError' }

  /authorizers/{appid}/option:
    parameters:
      - $ref: '#/components/parameters/Appid'
    get:
      tags: [authorizers]
      operationId: getAuthorizerOption
      summary: 读取授权方选项
      parameters:
        - name: optionName
          in: query
          required: true
          schema: { $ref: '#/components/schemas/AuthorizerOptionName' }
      responses:
        '200':
          description: 选项值
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthorizerOption' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '502': { $ref: '#/components/responses/WeChatError' }
    put:
      tags: [authorizers]
      operationId: setAuthorizerOption
      summary: 设置授权方选项
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuthorizerOptionUpdateRequest' }
      responses:
        '200':
          description: 选项值
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthorizerOption' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '502': { $ref: '#/components/responses/WeChatError' }

  /drafts:
    get:
      tags: [templates]
      operationId: listDrafts
      summary: 代码草稿箱列表（component_access_token）
      responses:
        '200':
          description: 草稿列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DraftListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '502': { $ref: '#/components/responses/WeChatError' }

  /drafts/sync:
    post:
      tags: [templates]
      operationId: syncDrafts
      summary: 从微信侧同步草稿箱
      responses:
        '200':
          description: 同步结果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SyncSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '502': { $ref: '#/components/responses/WeChatError' }

  /drafts/{draftId}/add-to-template:
    parameters:
      - name: draftId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    post:
      tags: [templates]
      operationId: addDraftToTemplate
      summary: 将草稿添加到模板库（上限 200，超限报 85065）
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddToTemplateRequest' }
      responses:
        '200':
          description: 同步后的模板列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TemplateListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '502': { $ref: '#/components/responses/WeChatError' }

  /templates:
    get:
      tags: [templates]
      operationId: listTemplates
      summary: 代码模板库列表（component_access_token）
      parameters:
        - name: templateType
          in: query
          description: 0=普通模板（唯一可用），1=标准模板（官方已下架）
          schema: { type: integer, enum: [0, 1] }
      responses:
        '200':
          description: 模板列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TemplateListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '502': { $ref: '#/components/responses/WeChatError' }

  /templates/sync:
    post:
      tags: [templates]
      operationId: syncTemplates
      summary: 从微信侧同步模板库
      responses:
        '200':
          description: 同步结果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SyncSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '502': { $ref: '#/components/responses/WeChatError' }

  /templates/{templateId}:
    parameters:
      - name: templateId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    patch:
      tags: [templates]
      operationId: updateTemplate
      summary: 标记默认模板 / 备注
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TemplateUpdateRequest' }
      responses:
        '200':
          description: 更新后的模板
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CodeTemplate' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [templates]
      operationId: deleteTemplate
      summary: 删除代码模板
      responses:
        '204': { description: 已删除 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '502': { $ref: '#/components/responses/WeChatError' }

  /preflight:
    post:
      tags: [preflight]
      operationId: runPreflight
      summary: 对目标小程序逐项体检（授权/权限集/类目/隐私指引/域名/额度/模板库余量）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PreflightRequest' }
      responses:
        '200':
          description: 体检结果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PreflightResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /jobs/preview:
    post:
      tags: [jobs]
      operationId: previewJob
      summary: 预览批量作业的逐项最终请求体（dry-run，不调用微信）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JobCreateRequest' }
      responses:
        '200':
          description: 逐项预览
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobPreviewResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /jobs:
    get:
      tags: [jobs]
      operationId: listJobs
      summary: 作业列表
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: type
          in: query
          schema: { $ref: '#/components/schemas/JobType' }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/JobStatus' }
      responses:
        '200':
          description: 分页列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [jobs]
      operationId: createJob
      summary: 创建批量作业
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JobCreateRequest' }
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '409': { $ref: '#/components/responses/Conflict' }

  /jobs/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [jobs]
      operationId: getJob
      summary: 作业详情（含进度统计）
      responses:
        '200':
          description: 作业
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /jobs/{id}/items:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [jobs]
      operationId: listJobItems
      summary: 作业逐项执行明细
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/JobItemStatus' }
        - name: appid
          in: query
          schema: { type: string }
      responses:
        '200':
          description: 分页明细
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobItemListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /jobs/{id}/start:
    parameters:
      - $ref: '#/components/parameters/JobId'
    post:
      tags: [jobs]
      operationId: startJob
      summary: 启动作业
      responses:
        '200':
          description: 作业
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /jobs/{id}/pause:
    parameters:
      - $ref: '#/components/parameters/JobId'
    post:
      tags: [jobs]
      operationId: pauseJob
      summary: 暂停作业
      responses:
        '200':
          description: 作业
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /jobs/{id}/resume:
    parameters:
      - $ref: '#/components/parameters/JobId'
    post:
      tags: [jobs]
      operationId: resumeJob
      summary: 恢复作业
      responses:
        '200':
          description: 作业
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /jobs/{id}/cancel:
    parameters:
      - $ref: '#/components/parameters/JobId'
    post:
      tags: [jobs]
      operationId: cancelJob
      summary: 取消作业（未开始项标记取消）
      responses:
        '200':
          description: 作业
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /jobs/{id}/retry-failed:
    parameters:
      - $ref: '#/components/parameters/JobId'
    post:
      tags: [jobs]
      operationId: retryFailedJobItems
      summary: 重试失败项（永久失败类不会被重试）
      responses:
        '200':
          description: 作业
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /audits:
    get:
      tags: [audits]
      operationId: listAudits
      summary: 审核单列表
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: appid
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/AuditStatus' }
      responses:
        '200':
          description: 分页列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /audits/sync:
    post:
      tags: [audits]
      operationId: syncAudits
      summary: 向微信侧核对审核状态（事件推送的兜底对账）
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AppidSelection' }
      responses:
        '200':
          description: 同步结果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SyncSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '502': { $ref: '#/components/responses/WeChatError' }

  /audits/{appid}/history:
    parameters:
      - $ref: '#/components/parameters/Appid'
    get:
      tags: [audits]
      operationId: listAuditHistory
      summary: 单个小程序的审核历史
      responses:
        '200':
          description: 审核记录
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AuditRecord' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /audits/{appid}/undo:
    parameters:
      - $ref: '#/components/parameters/Appid'
    post:
      tags: [audits]
      operationId: undoAudit
      summary: 撤回审核（每账号每天 ≤5 次、每月 ≤10 次，超限 87013）
      responses:
        '200':
          description: 撤回结果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditActionResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '502': { $ref: '#/components/responses/WeChatError' }

  /audits/{appid}/speed-up:
    parameters:
      - $ref: '#/components/parameters/Appid'
    post:
      tags: [audits]
      operationId: speedUpAudit
      summary: 加急审核（需已提审且在待审核队列）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SpeedUpRequest' }
      responses:
        '200':
          description: 加急结果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditActionResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '502': { $ref: '#/components/responses/WeChatError' }

  /audits/{appid}/quota:
    parameters:
      - $ref: '#/components/parameters/Appid'
    get:
      tags: [audits]
      operationId: getAuditQuota
      summary: 查询服务商提审与加急额度（旗下小程序共用）
      responses:
        '200':
          description: 额度
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditQuota' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '502': { $ref: '#/components/responses/WeChatError' }

  /releases:
    get:
      tags: [releases]
      operationId: listReleases
      summary: 发布台账
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: appid
          in: query
          schema: { type: string }
      responses:
        '200':
          description: 分页列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReleaseListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /releases/{appid}/version:
    parameters:
      - $ref: '#/components/parameters/Appid'
    get:
      tags: [releases]
      operationId: getVersionInfo
      summary: 体验版与线上版信息
      responses:
        '200':
          description: 版本信息
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VersionInfo' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '502': { $ref: '#/components/responses/WeChatError' }

  /releases/{appid}/release:
    parameters:
      - $ref: '#/components/parameters/Appid'
    post:
      tags: [releases]
      operationId: releaseApp
      summary: 发布最后一个审核通过的版本（全量，立即生效）
      responses:
        '200':
          description: 发布结果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditActionResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '502': { $ref: '#/components/responses/WeChatError' }

  /releases/{appid}/gray:
    parameters:
      - $ref: '#/components/parameters/Appid'
    post:
      tags: [releases]
      operationId: grayReleaseApp
      summary: 分阶段发布（灰度比例只能递增）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GrayReleaseRequest' }
      responses:
        '200':
          description: 灰度结果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditActionResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '502': { $ref: '#/components/responses/WeChatError' }

  /releases/{appid}/gray-plan:
    parameters:
      - $ref: '#/components/parameters/Appid'
    get:
      tags: [releases]
      operationId: getGrayReleasePlan
      summary: 查询分阶段发布计划
      responses:
        '200':
          description: 灰度计划
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GrayReleasePlan' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '502': { $ref: '#/components/responses/WeChatError' }

  /releases/{appid}/revert-gray:
    parameters:
      - $ref: '#/components/parameters/Appid'
    post:
      tags: [releases]
      operationId: revertGrayRelease
      summary: 取消分阶段发布
      responses:
        '200':
          description: 结果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditActionResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '502': { $ref: '#/components/responses/WeChatError' }

  /releases/{appid}/history-versions:
    parameters:
      - $ref: '#/components/parameters/Appid'
    get:
      tags: [releases]
      operationId: listRevertVersions
      summary: 可回退的历史版本（最多最近 5 个）
      responses:
        '200':
          description: 历史版本
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/HistoryVersion' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '502': { $ref: '#/components/responses/WeChatError' }

  /releases/{appid}/revert:
    parameters:
      - $ref: '#/components/parameters/Appid'
    post:
      tags: [releases]
      operationId: revertRelease
      summary: 版本回退（不传 appVersion 则回退到上一个版本）
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RevertRequest' }
      responses:
        '200':
          description: 回退结果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditActionResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '502': { $ref: '#/components/responses/WeChatError' }

  /releases/{appid}/trial-qrcode:
    parameters:
      - $ref: '#/components/parameters/Appid'
    get:
      tags: [releases]
      operationId: getTrialQRCode
      summary: 体验版二维码（返回 base64 图片）
      parameters:
        - name: path
          in: query
          description: 扫码后进入的页面（服务端会做一次 urlencode）
          schema: { type: string }
      responses:
        '200':
          description: 二维码
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QRCodeImage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '502': { $ref: '#/components/responses/WeChatError' }

  /apps/{appid}/visit-status:
    parameters:
      - $ref: '#/components/parameters/Appid'
    get:
      tags: [apps]
      operationId: getVisitStatus
      summary: 查询小程序服务状态
      responses:
        '200':
          description: 服务状态
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VisitStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '502': { $ref: '#/components/responses/WeChatError' }
    put:
      tags: [apps]
      operationId: setVisitStatus
      summary: 暂停 / 恢复服务
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VisitStatusUpdateRequest' }
      responses:
        '200':
          description: 服务状态
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VisitStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '502': { $ref: '#/components/responses/WeChatError' }

  /apps/{appid}/pages:
    parameters:
      - $ref: '#/components/parameters/Appid'
    get:
      tags: [apps]
      operationId: listCodePages
      summary: 已上传代码的页面列表（供提审配置选地址）
      responses:
        '200':
          description: 页面列表
          content:
            application/json:
              schema:
                type: array
                items: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '502': { $ref: '#/components/responses/WeChatError' }

  /apps/{appid}/support-version:
    parameters:
      - $ref: '#/components/parameters/Appid'
    get:
      tags: [apps]
      operationId: getSupportVersion
      summary: 最低基础库版本与用户占比
      responses:
        '200':
          description: 基础库
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupportVersion' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '502': { $ref: '#/components/responses/WeChatError' }
    put:
      tags: [apps]
      operationId: setSupportVersion
      summary: 设置最低基础库版本
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SupportVersionUpdateRequest' }
      responses:
        '200':
          description: 基础库
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupportVersion' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '502': { $ref: '#/components/responses/WeChatError' }

  /apps/domains/apply:
    post:
      tags: [apps]
      operationId: applyDomains
      summary: 批量配置小程序服务器域名 / 业务域名（托管后只能使用第三方平台登记的域名）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DomainApplyRequest' }
      responses:
        '200':
          description: 逐项结果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DomainApplyResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /audit-profiles:
    get:
      tags: [audits]
      operationId: listAuditProfiles
      summary: 提审配置列表（类目/标题/标签/UGC 声明等，供批量提审复用）
      responses:
        '200':
          description: 列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditProfileListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [audits]
      operationId: createAuditProfile
      summary: 新建提审配置（itemList 的类目字段取自 GET /wxa/get_category，即 getAllCategoryName）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuditProfileUpsertRequest' }
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditProfile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /audit-profiles/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    patch:
      tags: [audits]
      operationId: updateAuditProfile
      summary: 编辑提审配置
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuditProfileUpsertRequest' }
      responses:
        '200':
          description: 更新后的配置
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditProfile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [audits]
      operationId: deleteAuditProfile
      summary: 删除提审配置（被小程序引用时返回 409）
      responses:
        '204': { description: 已删除 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /logs/api-calls:
    get:
      tags: [logs]
      operationId: listApiCallLogs
      summary: 微信接口调用日志
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: appid
          in: query
          schema: { type: string }
        - name: jobId
          in: query
          schema: { type: string }
        - name: endpoint
          in: query
          schema: { type: string }
        - name: errcode
          in: query
          schema: { type: integer }
      responses:
        '200':
          description: 分页列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiCallLogListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /logs/callbacks:
    get:
      tags: [logs]
      operationId: listCallbackEvents
      summary: 微信回调事件
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: kind
          in: query
          schema: { $ref: '#/components/schemas/CallbackKind' }
        - name: appid
          in: query
          schema: { type: string }
        - name: infoType
          in: query
          schema: { type: string }
      responses:
        '200':
          description: 分页列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CallbackEventListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /logs/operations:
    get:
      tags: [logs]
      operationId: listOperationLogs
      summary: 平台操作日志
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: action
          in: query
          schema: { type: string }
      responses:
        '200':
          description: 分页列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OperationLogListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 20 }
    Appid:
      name: appid
      in: path
      required: true
      schema: { type: string }
    JobId:
      name: id
      in: path
      required: true
      schema: { type: string }

  responses:
    Unauthorized:
      description: 未认证或令牌无效
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: 状态冲突（如重复在途作业、未授权却要删除、额度耗尽）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ValidationError:
      description: 参数校验失败
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    TooManyRequests:
      description: 请求过于频繁
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    WeChatError:
      description: 微信侧调用失败（message 内含 errcode 与官方 errmsg）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: 业务错误码，如 INVALID_CREDENTIALS / NOT_FOUND / VALIDATION_ERROR / WECHAT_API_ERROR
        message: { type: string }
        errcode:
          type: integer
          nullable: true
          description: 微信返回码（如 85085、61039），仅微信侧失败时出现
      additionalProperties: false

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string }
      additionalProperties: false

    LoginResponse:
      type: object
      required: [token, user]
      properties:
        token: { type: string }
        user: { $ref: '#/components/schemas/UserInfo' }
      additionalProperties: false

    UserInfo:
      type: object
      required: [username, userType]
      properties:
        username: { type: string }
        userType: { type: string, enum: [admin] }
      additionalProperties: false

    AuthorizationStatus:
      type: string
      enum: [authorized, unauthorized]

    AuthType:
      type: integer
      description: 1 仅公众号 / 2 仅小程序 / 3 公众号+小程序 / 4 小程序推客 / 5 视频号 / 6 全部 / 8 带货助手
      enum: [1, 2, 3, 4, 5, 6, 8]

    TokenScope:
      type: string
      enum: [component, authorizer]

    JobType:
      type: string
      description: |
        commit 上传代码（生成体验版）/ submit_audit 提审 / release 发布 /
        pipeline 全流程（commit → 隐私检测 → 提审 → 审核通过 → 发布）/
        sync_info 同步授权方信息 / sync_audit_status 对账审核状态 /
        undo_audit 撤回审核 / speedup_audit 加急 / set_domain 域名配置 /
        revert 版本回退 / toggle_visit 服务状态
      enum:
        [commit, submit_audit, release, pipeline, sync_info, sync_audit_status, undo_audit, speedup_audit, set_domain, revert, toggle_visit]

    JobStatus:
      type: string
      enum: [pending, running, paused, succeeded, partial_failed, failed, canceled, interrupted]

    JobItemStatus:
      type: string
      description: waiting 表示在等前置条件（隐私检测完成 / 审核通过）或退避重试
      enum: [pending, waiting, running, succeeded, failed, skipped, canceled]

    JobStep:
      type: string
      description: |
        commit 上传代码 / privacy_check 隐私检测 / submit_audit 提审 / release 发布 /
        single 单步作业（sync_info、sync_audit_status、undo_audit、speedup_audit、
        set_domain、revert、toggle_visit 这些类型只有一个步骤）
      enum: [commit, privacy_check, submit_audit, release, single]

    ErrorClass:
      type: string
      description: |
        retryable 可重试 / token_expired 需刷新令牌 / rate_limited 频次或额度 /
        environment 环境问题（IP 白名单等，需人工修复）/ permanent 永久失败 /
        wechat_unknown 未归类
      enum: [retryable, token_expired, rate_limited, environment, permanent, wechat_unknown]

    CallbackKind:
      type: string
      enum: [component, message]

    PlatformStatus:
      type: object
      required:
        - componentAppid
        - ticketFresh
        - authorizationEventUrl
        - messageEventUrl
        - authAuthorized
        - authUnauthorized
        - jobRunning
        - templateCount
      properties:
        componentAppid: { type: string }
        componentAppidMasked: { type: string }
        ticketFresh: { type: boolean, description: 最近票据是否在 20 分钟内收到 }
        ticketAgeSeconds:
          type: integer
          format: int64
          nullable: true
        ticketUpdatedAt: { type: string, format: date-time, nullable: true }
        componentTokenValid: { type: boolean }
        componentTokenExpiresAt: { type: string, format: date-time, nullable: true }
        authorizationEventUrl: { type: string, description: 需填入开放平台后台的授权事件接收 URL }
        messageEventUrl: { type: string, description: 需填入开放平台后台的消息与事件接收 URL（含 $APPID$） }
        authRedirectUri: { type: string }
        authAuthorized: { type: integer }
        authUnauthorized: { type: integer }
        jobRunning: { type: integer }
        jobFailed: { type: integer }
        templateCount: { type: integer }
        templateLimit: { type: integer }
        auditQuota: { $ref: '#/components/schemas/AuditQuota' }
        warnings:
          type: array
          description: 接入自检提示（缺票据、未配 IP 白名单、权限集缺失等）
          items: { type: string }
      additionalProperties: false

    Settings:
      type: object
      required: [jobConcurrency, jobMaxAttempts, wxMaxQps, logRetentionDays, defaultTemplateId, defaultAuditProfileId]
      properties:
        jobConcurrency: { type: integer, minimum: 1, maximum: 8 }
        jobMaxAttempts: { type: integer, minimum: 1, maximum: 8 }
        wxMaxQps: { type: integer, minimum: 1, maximum: 50 }
        logRetentionDays: { type: integer, minimum: 1, maximum: 365 }
        defaultTemplateId: { type: integer, format: int64, nullable: true }
