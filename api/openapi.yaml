      type: object
      required: [appid, ok]
      properties:
        appid: { type: string }
        ok: { type: boolean }
        errcode: { type: integer, nullable: true }
        errmsg: { type: string, nullable: true }
        invalidDomains:
          type: array
          items: { type: string }
        missingIcpDomains:
          type: array
          items: { type: string }
      additionalProperties: false

    AuditProfile:
      type: object
      required: [id, name, isDefault]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        isDefault: { type: boolean }
        itemList:
          type: object
          additionalProperties: true
          nullable: true
          description: |
            单条提审项，字段与 submit_audit 的 item_list 元素一致：
            address（页面路径，取自 getCodePage）、tag（空格分隔的标签）、title（≤32 字）、
            first_class/second_class/third_class（中文类目名）、first_id/second_id/third_id（数字 id）。
            类目 6 个字段必须来自 GET /wxa/get_category（getAllCategoryName）。
        versionDesc: { type: string, nullable: true }
        ugcDeclare:
          type: object
          additionalProperties: true
          nullable: true
          description: UGC 审核机制声明（scene/method/other_scene_desc/has_audit_team/audit_desc）
        privacyApiNotUse: { type: boolean, nullable: true }
        orderPath: { type: string, nullable: true }
        note: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      additionalProperties: false

    AuditProfileUpsertRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
        isDefault: { type: boolean }
        itemList:
          type: object
          additionalProperties: true
          nullable: true
        versionDesc: { type: string, nullable: true }
        ugcDeclare:
          type: object
          additionalProperties: true
          nullable: true
        privacyApiNotUse: { type: boolean, nullable: true }
        orderPath: { type: string, nullable: true }
        note: { type: string, nullable: true }
      additionalProperties: false

    AuditProfileListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AuditProfile' }
      additionalProperties: false

    ApiCallLog:
      type: object
      required: [id, endpoint, scope, ok, createdAt]
      properties:
        id: { type: integer, format: int64 }
        jobId: { type: string, nullable: true }
        appid: { type: string, nullable: true }
        scope: { $ref: '#/components/schemas/TokenScope' }
        endpoint: { type: string }
        method: { type: string }
        httpStatus: { type: integer }
        ok: { type: boolean }
        errcode: { type: integer, nullable: true }
        errmsg: { type: string, nullable: true }
        errorClass: { $ref: '#/components/schemas/ErrorClass' }
        durationMs: { type: integer, format: int64 }
        request:
          type: object
          additionalProperties: true
          nullable: true
        response:
          type: object
          additionalProperties: true
          nullable: true
        createdAt: { type: string, format: date-time }
      additionalProperties: false

    ApiCallLogListResponse:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ApiCallLog' }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
      additionalProperties: false

    CallbackEvent:
      type: object
      required: [id, kind, signatureOk, processed, receivedAt]
      properties:
        id: { type: integer, format: int64 }
        kind: { $ref: '#/components/schemas/CallbackKind' }
        appid: { type: string, nullable: true }
        infoType: { type: string, nullable: true, description: component_verify_ticket / authorized / unauthorized / updateauthorized / weapp_audit_* }
        event: { type: string, nullable: true }
        decrypted:
          type: string
          nullable: true
          description: 解密后的明文报文（原样保留，含换行）
        signatureOk: { type: boolean }
        processed: { type: boolean }
        processNote: { type: string, nullable: true }
        receivedAt: { type: string, format: date-time }
      additionalProperties: false

    CallbackEventListResponse:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/CallbackEvent' }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
      additionalProperties: false

    OperationLog:
      type: object
      required: [id, actor, action, createdAt]
      properties:
        id: { type: integer, format: int64 }
        actor: { type: string }
        action: { type: string }
        targetType: { type: string, nullable: true }
        targetId: { type: string, nullable: true }
        detail:
          type: object
          additionalProperties: true
          nullable: true
        ip: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
      additionalProperties: false

    OperationLogListResponse:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/OperationLog' }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
      additionalProperties: false

